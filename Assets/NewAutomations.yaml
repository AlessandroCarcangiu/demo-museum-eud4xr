- id: '1722007598806'
  alias: Test ECAObject service
  description: ''
  trigger:
  - platform: event
    event_type: ciao
    event_data:
      message: ciao
  condition: []
  action:
  - event: test
    event_data:
      message: attribute type = giallo
  - metadata: {}
    data:
      entity_id: sensor.tshirt_1_ecaobject
      newPos:
        x: 0
        y: 0
        z: 1
    enabled: false
    action: eud4xr.moves_to
  - metadata: {}
    data:
      entity_id: sensor.tshirt_1_ecaobject
      obj: sensor.your_game_object_name
    enabled: false
    action: eud4xr.looks_to
  - metadata: {}
    data:
      entity_id: sensor.tshirt_1_ecaobject
      param1: 'true'
    enabled: false
    action: eud4xr.test
  - metadata: {}
    data:
      entity_id: sensor.tshirt_1_ecaobject
      path:
      - x: 10
        y: 20
        z: 30
      - x: 15
        y: 25
        z: 35
      - x: 5
        y: 15
        z: 25
    enabled: false
    action: eud4xr.moves_on
  - metadata: {}
    data:
      entity_id: sensor.tshirt_1_keypad
      input: testast
    enabled: false
    action: eud4xr.inserts
  - metadata: {}
    data:
      entity_id: sensor.tshirt_1_flyinganimal
      p:
      - x: 10
        y: 20
        z: 30
      - x: 15
        y: 25
        z: 35
      - x: 5
        y: 15
        z: 25
    action: eud4xr.flies_on
    enabled: false
  - metadata: {}
    data:
      entity_id: sensor.t_shirt_test_ecaobject
      newPos:
        x: 30
        y: 30
        z: 30
    enabled: false
    action: eud4xr.moves_to
  - metadata: {}
    data:
      entity_id: sensor.t_shirt_test_ecaobject
      obj: sensor.tshirt_1
    enabled: true
    action: eud4xr.looks_to
  mode: single
- id: b4690c170f7841639a23fca4f88474ab
  alias: Risposta a Pippo do_something con valori specifici
  trigger:
  - platform: template
    value_template: "{{ state_attr('sensor.t_shirt_test_ecaobject', 'position')['x']
      == 30 and\n    state_attr('sensor.t_shirt_test_ecaobject', 'position')['y']
      == 30 and\n    state_attr('sensor.t_shirt_test_ecaobject', 'position')['z']
      == 30 }}\n"
  action:
  - metadata: {}
    data:
      entity_id: sensor.t_shirt_test_ecaobject
      newRot:
        x: 5
        y: 30
        z: 30
    enabled: true
    action: eud4xr.rotates_around
- id: '1724832341923'
  alias: Test Event as Service
  description: ''
  trigger:
  - platform: event
    event_type: eud4xr
    event_data:
      subject: sensor.t_shirt_test_ecaobject
      verb: looks to
      parameters:
        obj: sensor.tshirt_1
    enabled: true
  - platform: event
    event_type: ciao
    event_data:
      message: ciao2
    enabled: false
  condition: []
  action:
  - metadata: {}
    data:
      entity_id: sensor.t_shirt_test_ecaobject
      path:
      - x: 1
        y: 1
        z: 1
      - x: 2
        y: 2
        z: 2
      - x: 3
        y: 3
        z: 3
    enabled: true
    action: eud4xr.moves_on
  mode: single
