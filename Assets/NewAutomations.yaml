- id: '1729087566491'
  alias: Statue Prev - David <- Baccus
  description: ''
  trigger:
  - platform: event
    event_type: eud4xr
    event_data:
      verb: interacts with
      variable: statue_button_prev
      subject: hand
  condition:
  - condition: template
    value_template: '{{state_attr("sensor.statue_baccus_ecaobject", "active") == "yes"}}'
  action:
  - event: eud4xr
  - action: eud4xr.activates
    data:
      entity_id: sensor.statue_david_ecaobject
  - action: eud4xr.deactivates
    data:
      entity_id: sensor.statue_baccus_ecaobject
